core:
  kicker: "Ide inti"
  title: "Sprint-nya tetap. Yang di-review berubah."
  intro: >-
    Keduanya sama-sama satu Sprint yang diakhiri satu Sprint Review. Bedanya
    ada pada apa yang mengisi Sprint, dan karena itu, apa yang bisa diperiksa
    di Review.
  top: "Sprint Review"
  reviewed: "Yang di-review"
  asks: "Sprint Review bertanya"
  pre:
    era: "Sprint pra-AI"
    title: "Siklus Review Delivery"
    label: "Sebuah Sprint digambarkan sebagai siklus. Membangun mengisi hampir seluruhnya, tiga item berurutan, dan Sprint Review di akhir memeriksa apakah item-item itu sudah di-deliver."
    items: ["Halaman referral", "Email undangan", "Banner hadiah"]
    result: "3 dari 3 selesai ✓"
    question: "“Sudah selesai? Sesuai jadwal?”"
    body: "Membangun mengisi seluruh Sprint. Pengguna baru bertemu hasilnya di Sprint Review, jadi Review memeriksa delivery: apa yang sudah dibangun dan apakah sesuai jadwal."
  post:
    era: "Sprint pasca-AI"
    title: "Siklus Review Business Outcome"
    label: "Sprint dengan panjang yang sama digambarkan sebagai siklus. Membangun hanya sebentar; tiga putaran bangun, pengguna, dan validasi mengisi Sprint, dan Sprint Review memeriksa apakah business outcome tercapai."
    metric: "Pelanggan yang mengajak teman"
    result: "Business outcome tercapai ✓"
    question: "“Business outcome-nya tercapai?”"
    body: "Membangun hanya butuh sebagian kecil Sprint. Sisanya untuk putaran bersama pengguna, jadi Review memeriksa business outcome: profit, rugi, keterlibatan pengguna."
  legend:
    plan: "rencana"
    build: "bangun"
    users: "pengguna"
    validate: "validasi"
  note: "Ilustrasi mekanismenya, bukan data hasil pengukuran."

shift:
  kicker: "Pergeseran"
  title: "Saat membangun bukan lagi hambatan, setiap akuntabilitas bergeser lebih dekat ke pengguna."
  intro: >-
    Scrum punya tiga akuntabilitas, dan tidak satu pun berbunyi “mengetik
    kode”. Ketika implementasi diambil alih AI, masing-masing bisa menjalankan
    apa yang digambarkan Scrum Guide.
  before: "Dulu"
  now: "Dengan AI"
  roles:
    - token: "PO"
      role: "Product Owner"
      before: "Sering kali hanya proxy atau juru tulis, mengubah permintaan menjadi tiket yang cukup rinci untuk pengerjaan yang panjang."
      now: "Seseorang yang punya kuasa sekaligus perhatian atas produk: cukup senior untuk fokus penuh pada tujuan bisnis dan metrik bisnis, tanpa proxy atau juru tulis di tengah. Bersedia memimpin Sprint Review di setiap Sprint, entah dua minggu atau sebulan, untuk mengevaluasi bisnis dan menetapkan business outcome berikutnya."
    - token: "Dev"
      role: "Developers"
      before: "Sebagian besar Sprint habis untuk detail implementasi."
      now: "Terdorong berpikir lebih tinggi dan lebih abstrak, sehingga punya lebih banyak ruang dan empati untuk pengguna."
    - token: "SM"
      role: "Scrum Master"
      before: "Banyak energi habis untuk menjaga proses delivery yang panjang tetap berjalan."
      now: "Leluasa fokus memfasilitasi interaksi Developers dengan pengguna, tempat asumsi divalidasi dan nilai tercipta."

