length:
  kicker: "Panjang Sprint"
  title: "Karena itu pula, memperpendek Sprint adalah langkah yang keliru."
  intro: >-
    Dengan AI, membangun dan menguji berlangsung cepat. Yang langka di dalam
    Sprint bukan lagi waktu membangun, melainkan putaran bersama pengguna.
    Sprint butuh ruang bagi Developers untuk mendatangi pengguna,
    memvalidasi asumsi tentang nilai, membangun ulang solusinya, dan
    mendatangi lagi, beberapa kali jika perlu, sampai business outcome
    tercapai.
  short: "Sprint yang dipendekkan"
  full: "Sprint penuh"
  round: "Putaran"
  build: "bangun"
  users: "pengguna"
  learn: "belajar"
  outcome_hit: "Business outcome tercapai"
  outcome_miss: "Business outcome belum tercapai"
  review: "Sprint Review"
  talk_short: "Pembicaraannya soal timeline: “Sudah selesai? Kapan?”"
  talk_full: "Pembicaraannya soal nilai: profit, rugi, keterlibatan pengguna."
  po_short: "Product Owner yang sebenarnya tidak punya alasan untuk hadir."
  po_full: "Product Owner yang sebenarnya punya segala alasan untuk hadir."
  counter: "Putaran bersama pengguna"
  columns:
    - title: "Scrum pra-AI"
      body: "Membangun menghabiskan seluruh Sprint, sehingga Sprint Review lebih banyak membahas timeline dan output. Product Owner yang sebenarnya tidak punya insentif untuk hadir, dan lahirlah proxy atau scribe Product Owner."
    - title: "AI + Sprint penuh"
      body: "Beberapa putaran bersama pengguna muat dalam satu Sprint, sehingga business outcome benar-benar bisa dicapai dan Review menjadi percakapan tentang profit, rugi, dan keterlibatan. Percakapan seperti itulah yang ingin diikuti Product Owner yang sebenarnya."
    - title: "AI + Sprint yang dipendekkan"
      body: "Putaran bersama pengguna makin sedikit, outcome terpotong, dan Review kembali membahas timeline. Keuntungan kecepatan habis untuk lebih banyak rapat, bukan lebih banyak validasi."
  fit: >-
    Scrum Guide menetapkan batas atas satu bulan dan menyerahkan panjangnya
    kepada tim. Adendum ini memakai ruang itu: jaga Sprint cukup panjang
    untuk beberapa putaran bersama pengguna, dan jadikan Sprint Review sesi
    kerja tentang business outcome.
  note: "Ilustrasi mekanismenya, bukan data hasil pengukuran."

additions:
  kicker: "Adendumnya"
  title: "Empat tambahan. Tidak ada yang dibuang."
  intro: >-
    Setiap tambahan adalah praktik yang muat di dalam Scrum sebagaimana
    tertulis. Di samping masing-masing ada bagian Scrum Guide yang menjadi
    pijakannya, dikutip kata demi kata.
  guide_label: "Kata Scrum Guide"
  fit_label: "Mengapa selaras"
  source_label: "Scrum Guide 2020"
  gloss_label: "Terjemahan bebas"
  items:
    - title: "Sprint Goal berupa business outcome, lengkap dengan satu outcome serep."
      body: >-
        Rumuskan Sprint Goal sebagai perubahan pada bisnis atau pada perilaku
        pengguna, bukan daftar hal yang akan dibangun. Karena AI bisa membuat
        tim sampai di tujuan beberapa hari lebih awal, sepakati satu outcome
        serep yang opsional saat Sprint Planning. Outcome serep hanya dipakai
        jika Sprint Goal tercapai sebelum Sprint Review tiba.
      example:
        label: "Contoh"
        rows:
          - k: "Bukan"
            v: "Membangun halaman referral."
            strike: true
          - k: "Sprint Goal"
            v: "20 pelanggan lama masing-masing mengajak satu teman."
          - k: "Outcome serep"
            v: "Teman pertama yang diajak menyelesaikan pembelian."
      quotes: [planning_why, goal_single, review_purpose]
      fit: >-
        Outcome serep bukan Sprint Goal kedua. Sprint tetap punya satu tujuan
        tunggal; serep adalah outcome paling bernilai berikutnya, disepakati
        sejak awal supaya tim tidak hanyut ke pekerjaan tak terencana ketika
        selesai lebih cepat. Selesai lebih awal bukan alasan memperpendek
        Sprint; itu ruang untuk satu putaran lagi bersama pengguna.
    - title: "Proxy atau scribe Product Owner belajar menjadi Developer."
      body: >-
        Jika di tim Anda ada orang yang tugasnya meneruskan keinginan pengambil
        keputusan yang sebenarnya, atau yang terutama menulis tiket, lapisan
        penerjemah itulah yang paling banyak dipangkas AI. Pengetahuan produk
        mereka terlalu berharga untuk hilang. Langkahnya adalah menjadi
        Developer: orang yang mengubah pengetahuan itu langsung menjadi
        Increment yang bisa dipakai, sementara AI yang mengetik. Akuntabilitas
        Product Owner dipegang oleh satu orang yang benar-benar memiliki
        business outcome.
      quotes: [po_one, po_delegate, dev_def]
      fit: >-
        Scrum Guide tidak mengenal peran proxy atau scribe. Yang ada hanya satu
        Product Owner yang tetap akuntabel, dan Developers yang menciptakan
        Increment. Tambahan ini mengembalikan orang ke dua akuntabilitas itu.
    - title: "Scrum Master mendorong agar update sampai ke pengguna secepat mungkin."
      body: >-
        Scrum Master terus mengajukan satu pertanyaan: siapa yang sudah memakai
        ini? Setiap update yang selesai harus sampai ke pengguna nyata secepat
        yang aman, bukan menunggu Sprint Review. Jika tidak, kecepatan AI akan
        menyeret seluruh organisasi ke tumpukan asumsi yang makin besar,
        persis seperti di era Waterfall.
      quotes: [inc_early, sm_barriers, empiricism]
      fit: >-
        Scrum Guide sudah menyatakan bahwa Sprint Review bukan gerbang rilis,
        dan sudah meminta Scrum Master menghilangkan penghalang antara
        stakeholder dan Scrum Team. Dengan AI, layanan itu menjadi inti
        pekerjaannya.
    - title: "Jaring pengaman teknis yang cukup kuat untuk kecepatan AI."
      body: >-
        Kecepatan hanya berguna kalau aman. Sebelum mengandalkan delivery
        berkecepatan AI, tim butuh jaring pengaman yang menangkap apa yang
        tidak lagi dibaca manusia baris demi baris. Misalnya: automated test,
        continuous integration, rilis bertahap atau dengan feature flag,
        monitoring, dan rollback yang cepat. Tuliskan ke dalam Definition of
        Done supaya tidak pernah menjadi pilihan.
      quotes: [dod_def, inc_verified, dod_not_met]
      fit: >-
        Scrum Guide menyerahkan isi Definition of Done kepada tim dan
        organisasinya. Tambahan ini menyatakan seberapa kuat ia harus dibuat.

# Free Indonesian renderings of the quoted passages, shown under the original.
gloss:
  planning_why: "Seluruh Scrum Team kemudian berkolaborasi menetapkan Sprint Goal yang menyampaikan mengapa Sprint tersebut bernilai bagi stakeholder."
  goal_single: "Sprint Goal adalah satu-satunya tujuan Sprint. Walaupun Sprint Goal merupakan komitmen Developers, ia memberi keleluasaan mengenai pekerjaan apa persisnya yang dibutuhkan untuk mencapainya."
  shorter: "Sprint yang lebih pendek dapat dipakai untuk menghasilkan lebih banyak siklus belajar dan membatasi risiko biaya serta usaha pada rentang waktu yang lebih kecil."
  fixed_length: "Sprint adalah event dengan panjang tetap, satu bulan atau kurang, untuk menciptakan konsistensi."
  review_purpose: "Tujuan Sprint Review adalah memeriksa hasil Sprint dan menentukan adaptasi ke depan."
  review_working: "Sprint Review adalah sesi kerja, dan Scrum Team sebaiknya tidak membatasinya menjadi sekadar presentasi."
  po_one: "Product Owner adalah satu orang, bukan komite."
  po_delegate: "Product Owner boleh mengerjakan pekerjaan di atas atau mendelegasikan tanggung jawabnya kepada orang lain. Apa pun pilihannya, Product Owner tetap akuntabel."
  dev_def: "Developers adalah orang-orang di dalam Scrum Team yang berkomitmen menciptakan setiap aspek dari Increment yang dapat dipakai, di setiap Sprint."
  inc_early: "Namun, Increment boleh diserahkan kepada stakeholder sebelum Sprint berakhir. Sprint Review tidak boleh dianggap sebagai gerbang untuk merilis nilai."
  sm_barriers: "Menghilangkan penghalang antara stakeholder dan Scrum Team."
  empiricism: "Empirisme menyatakan bahwa pengetahuan berasal dari pengalaman dan dari pengambilan keputusan berdasarkan apa yang diamati."
  dod_def: "Definition of Done adalah deskripsi formal tentang keadaan Increment ketika memenuhi ukuran kualitas yang dituntut produk."
  inc_verified: "Setiap Increment menambah seluruh Increment sebelumnya dan diverifikasi secara menyeluruh, sehingga semua Increment bekerja bersama."
  dod_not_met: "Jika sebuah Product Backlog item tidak memenuhi Definition of Done, ia tidak boleh dirilis, bahkan tidak boleh ditampilkan di Sprint Review."
  immutable: "Kerangka kerja Scrum, sebagaimana diuraikan di sini, tidak dapat diubah. Menerapkan sebagian Scrum memang mungkin, tetapi hasilnya bukan Scrum. Scrum hanya ada dalam keutuhannya dan berfungsi baik sebagai wadah bagi teknik, metodologi, dan praktik lain."
  incomplete: "Kerangka kerja Scrum sengaja dibuat tidak lengkap, hanya mendefinisikan bagian yang diperlukan untuk menerapkan teori Scrum. Scrum dibangun oleh kecerdasan kolektif orang-orang yang menggunakannya."

