length:
  kicker: "Sprint length"
  title: "That is also why shortening the Sprint is the wrong move."
  intro: >-
    With AI, building and testing are quick. The scarce thing in a Sprint is
    no longer build time; it is rounds with users. A Sprint needs room for
    the Developers to go to users, validate the assumptions about value,
    rebuild the solution, and go again, several times if needed, until the
    business outcome is reached.
  short: "Shortened Sprint"
  full: "Full Sprint"
  round: "Round"
  build: "build"
  users: "users"
  learn: "learn"
  outcome_hit: "Business outcome reached"
  outcome_miss: "Business outcome not reached"
  review: "Sprint Review"
  talk_short: "The talk is about timeline: “Is it done? When?”"
  talk_full: "The talk is about value: profit, loss, user engagement."
  po_short: "The real Product Owner has no reason to attend."
  po_full: "The real Product Owner has every reason to attend."
  counter: "Rounds with users"
  cue_bad: "Bad"
  cue_good: "Good"
  columns:
    - title: "Pre-AI Scrum"
      body: "Building took the whole Sprint, so the Sprint Review was mostly about timeline and output. The real Product Owner had little incentive to attend, and the proxy or scribe Product Owner was born."
      verdict: bad
    - title: "AI + shortened Sprint"
      body: "Fewer rounds with users fit, the outcome is cut short, and the Review slides back to timeline talk. The speed gain is spent on more meetings instead of more validation."
      verdict: bad
    - title: "AI + full Sprint"
      body: "Several rounds with users fit in one Sprint, so the business outcome can actually be reached and the Review becomes a conversation about profit, loss and engagement. That is a conversation the real Product Owner wants to be in."
      verdict: good
  fit: >-
    The Scrum Guide sets a ceiling of one month and leaves the length to the
    team. The addendum uses that room: keep the Sprint long enough for
    several rounds with users, and make the Sprint Review a working session
    about the business outcome.
  note: "An illustration of the mechanism, not measured data."

additions:
  bridge: "So, what should we add to Scrum to make this work?"
  kicker: "The addendum"
  title: "Four additions. Nothing removed."
  intro: >-
    Each addition is a practice that fits inside Scrum as written. Next to
    each one is the passage of the Scrum Guide it builds on, quoted word for
    word.
  guide_label: "What the Scrum Guide says"
  fit_label: "How it fits"
  source_label: "Scrum Guide 2020"
  items:
    - title: "The Sprint Goal is a business outcome, with a spare one ready."
      body: >-
        State the Sprint Goal as a change in the business or in what users do,
        never as a list of things to build. Because AI can get you there days
        early, agree on one optional spare outcome during Sprint Planning. It
        only comes into play if the Sprint Goal is achieved before the Sprint
        Review.
      example:
        label: "Example"
        rows:
          - k: "Instead of"
            v: "Build the referral page."
            strike: true
          - k: "Sprint Goal"
            v: "20 existing customers each invite a friend."
          - k: "Spare outcome"
            v: "The first invited friend completes a purchase."
      quotes: [planning_why, goal_single, review_purpose]
      fit: >-
        The spare outcome is not a second Sprint Goal. The Sprint keeps its
        single objective; the spare is the next most valuable outcome, agreed
        in advance so the team doesn’t drift into unplanned work. Finishing
        early is not a reason to shorten the Sprint; it is room for another
        round with users.
    - title: "A proxy or scribe Product Owner learns to develop."
      body: >-
        If your team has someone who relays the real decision-maker’s wishes,
        or who mainly writes tickets, that translation layer is what AI
        shrinks the most. Their product knowledge is too valuable to lose. The
        move is to become a Developer: someone who turns that knowledge
        directly into usable Increments, with AI doing the typing. The Product
        Owner accountability goes to the one person who truly owns the
        business outcome.
      quotes: [po_one, po_delegate, dev_def]
      fit: >-
        The Scrum Guide has no proxy or scribe role. It has one Product Owner
        who stays accountable, and Developers who create the Increment. This
        addition moves people back into those two accountabilities.
    - title: "The Scrum Master pushes for updates to reach users as soon as possible."
      body: >-
        The Scrum Master keeps asking one question: who has used this yet?
        Every finished update should reach real users as early as it safely
        can, not wait for the Sprint Review. Otherwise AI speed pulls the
        whole organization into ever bigger piles of assumptions, just like in
        the Waterfall era.
      quotes: [inc_early, sm_barriers, empiricism]
      fit: >-
        The Guide already says the Sprint Review is not a release gate, and
        already asks the Scrum Master to remove barriers between stakeholders
        and the Scrum Team. With AI, that service moves to the centre of the
        job.
    - title: "A technical safety net strong enough for AI speed."
      body: >-
        Speed only helps if it is safe. Before a team leans on AI-paced
        delivery, it needs a safety net that catches what people no longer
        read line by line. For example: automated tests, continuous
        integration, staged or flagged releases, monitoring and quick
        rollback. Write it into the Definition of Done, so it is never
        optional.
      quotes: [dod_def, inc_verified, dod_not_met]
      fit: >-
        The Guide leaves the content of the Definition of Done to the team and
        its organization. This addition says what it must be strong enough
        for.

proof:
  kicker: "The check"
  title: "Is this still Scrum? Yes, in its entirety."
  intro: >-
    The Scrum Guide is strict about one thing: you cannot remove or change its
    parts and still call the result Scrum. It is just as clear that Scrum is
    meant to hold other practices inside it.
  table_title: "What the addendum changes"
  unchanged: "Unchanged"
  rows:
    - k: "Accountabilities"
      d: "Product Owner, Scrum Master, Developers"
    - k: "Events"
      d: "Sprint, Sprint Planning, Daily Scrum, Sprint Review, Sprint Retrospective"
    - k: "Artifacts and commitments"
      d: "Product Backlog, Sprint Backlog, Increment; Product Goal, Sprint Goal, Definition of Done"
  added_k: "Practices inside the framework"
  added_d: "The four additions above"
  added_v: "Four added"
  source: >-
    Quotations are word for word from the Scrum Guide, November 2020, by Ken
    Schwaber and Jeff Sutherland, under CC BY-SA 4.0. This addendum is an
    independent proposal, not endorsed by the authors of the Scrum Guide.
  read_guide: "Read the full Scrum Guide"

