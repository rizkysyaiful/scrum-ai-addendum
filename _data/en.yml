shift:
  kicker: "The shift"
  title: "Focus on business outcome = Focus on users"
  intro: >-
    Scrum has three accountabilities, and none of them is “type the code”.
    With AI taking over implementation, each one can do what the Scrum Guide
    describes.
  before: "Before"
  now: "With AI"
  roles:
    - token: "PO"
      role: "Product Owner"
      before: "Often a proxy or a scribe, turning requests into tickets detailed enough for a long build."
      now: "Someone with both the power and the attention for the product: senior enough to be laser-focused on business goals and business metrics, with no proxy or scribe in between. Willing to host the Sprint Review every Sprint, whether that is two weeks or a month, to evaluate the business and set the next business outcomes."
    - token: "Dev"
      role: "Developers"
      before: "Most of the Sprint goes into implementation detail."
      now: "Pushed toward higher-level, more abstract thinking, which leaves more bandwidth and empathy for users."
    - token: "SM"
      role: "Scrum Master"
      before: "Much of the energy goes to keeping a long delivery process moving."
      now: "Free to focus on facilitating the interaction between Developers and users, the place where assumptions are validated and value is created."

