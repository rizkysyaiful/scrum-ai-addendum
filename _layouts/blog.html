---
layout: default
---
{%- assign t = site.data[page.lang] -%}
<section class="page-head dark">
  <div class="wrap">
    <p class="kicker">{{ t.blog.kicker }}</p>
    <h1 class="page-title">{{ t.blog.title }}</h1>
    <p class="sec-intro">{{ t.blog.intro }}</p>
  </div>
</section>
<section class="paper blog-index">
  <div class="wrap">
    {% include post-list.html lang=page.lang t=t limit=500 %}
  </div>
</section>
